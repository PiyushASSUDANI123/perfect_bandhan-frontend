  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Fetch Firebase configuration dynamically from the backend environment
    async function loadFirebase() {
      try {
        const backendBase = 'https://humsafar.piyushassudani.in';
        
        console.log('[Firebase] Fetching configuration dynamically from backend...');
        const response = await fetch(`${backendBase}/api/v1/auth/firebase-config`);
        if (!response.ok) {
          throw new Error('Config endpoint response status: ' + response.status);
        }
        
        const firebaseConfig = await response.json();
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        window.firebaseApp = app;
        console.log('[Firebase] Dynamic initialization completed successfully.');
      } catch (err) {
        console.error('[Firebase Init Error] Dynamic load failed:', err);
      }
    }

    loadFirebase();
  </script>
